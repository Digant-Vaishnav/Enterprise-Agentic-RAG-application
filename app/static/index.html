<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Agentic RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --bg-elev:#0a0a0a;
    --bg-secondary:#050505;
    --bg-input:#000000;
    --text:#fafafa;
    --text-muted:#a3a8b8;
    --text-faint:#6b7280;
    --primary:#ff4b4b;
    --primary-hover:#ff6c6c;
    --border:rgba(250,250,250,0.16);
    --border-strong:rgba(250,250,250,0.28);
    --success-bg:rgba(33,195,84,0.08);
    --success-border:rgba(33,195,84,0.35);
    --success-text:#3dd56d;
    --info-bg:rgba(28,131,225,0.08);
    --info-border:rgba(28,131,225,0.35);
    --info-text:#5eb2f7;
    --radius:0.5rem;
    --sidebar-w:320px;
    --font:'Source Sans Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'Source Code Pro',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;height:100vh;overflow:hidden;}

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--bg-secondary);
    border-right:1px solid var(--border);
    padding:1.75rem 1.5rem;
    overflow-y:auto;
    transition:margin-left .25s ease;
  }
  #sidebar h1{
    font-size:1.5rem;
    font-weight:700;
    margin:0 0 1rem 0;
    letter-spacing:-0.01em;
  }
  hr.divider{
    border:none;
    border-top:1px solid var(--border);
    margin:1rem 0 1.25rem 0;
  }
  .alert{
    display:flex;
    gap:0.6rem;
    align-items:flex-start;
    padding:0.75rem 0.9rem;
    border-radius:var(--radius);
    font-size:0.875rem;
    margin-bottom:0.75rem;
    border:1px solid transparent;
    word-break:break-word;
  }
  .alert-success{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text);}
  .alert-info{background:var(--info-bg);border-color:var(--info-border);color:var(--info-text);}
  .alert .icon{flex-shrink:0;line-height:1.4;}

  .st-btn{
    width:100%;
    padding:0.5rem 1rem;
    border-radius:var(--radius);
    border:1px solid var(--border-strong);
    background:transparent;
    color:var(--text);
    font-family:var(--font);
    font-size:1rem;
    font-weight:400;
    cursor:pointer;
    transition:border-color .15s ease,color .15s ease,background .15s ease;
    margin-top:0.5rem;
  }
  .st-btn:hover{border-color:var(--primary);color:var(--primary);}
  .st-btn-primary{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
    font-weight:600;
  }
  .st-btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff;}

  #sidebar-toggle{
    display:none;
    position:fixed;
    top:0.75rem;
    left:0.75rem;
    z-index:50;
    background:var(--bg-secondary);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius);
    width:2.25rem;
    height:2.25rem;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:1.1rem;
  }

  /* ---------- MAIN ---------- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100vh;
  }
  #main-header{
    padding:2rem 3rem 1rem 3rem;
    flex-shrink:0;
  }
  #main-header h1{
    font-size:2.25rem;
    font-weight:700;
    margin:0;
    letter-spacing:-0.02em;
  }
  #chat-scroll{
    flex:1;
    overflow-y:auto;
    padding:0.5rem 3rem 1rem 3rem;
  }
  .chat-msg{
    display:flex;
    gap:1rem;
    padding:1rem 0;
    border-bottom:1px solid var(--border);
    max-width:850px;
  }
  .avatar{
    flex-shrink:0;
    width:2rem;
    height:2rem;
    border-radius:50%;
    background:var(--bg-elev);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.05rem;
  }
  .msg-body{flex:1;min-width:0;padding-top:0.15rem;}
  .msg-text{white-space:pre-wrap;word-wrap:break-word;font-size:1rem;}
  .cursor{animation:blink 0.9s step-start infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* status widget */
  .status-box{
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    margin:0.25rem 0 0.75rem 0;
    overflow:hidden;
    background:var(--bg-elev);
  }
  .status-header{
    display:flex;
    align-items:center;
    gap:0.6rem;
    padding:0.65rem 0.9rem;
    cursor:pointer;
    font-size:0.95rem;
    user-select:none;
  }
  .status-header .chev{margin-left:auto;color:var(--text-faint);transition:transform .15s ease;font-size:0.8rem;}
  .status-box.collapsed .status-header .chev{transform:rotate(-90deg);}
  .status-box.collapsed .status-body{display:none;}
  .status-body{
    padding:0 0.9rem 0.85rem 0.9rem;
    font-size:0.9rem;
    color:var(--text-muted);
  }
  .status-step{padding:0.15rem 0;opacity:0;animation:fadeIn .35s ease forwards;}
  @keyframes fadeIn{to{opacity:1;}}
  .spinner{
    width:0.95rem;height:0.95rem;
    border:2px solid var(--border-strong);
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .7s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* expanders */
  .expander{
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    margin-top:0.6rem;
    overflow:hidden;
  }
  .expander-header{
    display:flex;
    align-items:center;
    gap:0.5rem;
    padding:0.55rem 0.85rem;
    cursor:pointer;
    font-size:0.875rem;
    user-select:none;
  }
  .expander-header .chev{margin-left:auto;color:var(--text-faint);transition:transform .15s ease;font-size:0.75rem;}
  .expander.open .expander-header .chev{transform:rotate(90deg);}
  .expander-body{display:none;padding:0 0.85rem 0.85rem 0.85rem;}
  .expander.open .expander-body{display:block;}
  .expander .expander{margin:0.5rem 0;}
  .info-box{
    background:var(--info-bg);
    border:1px solid var(--info-border);
    color:var(--text);
    border-radius:var(--radius);
    padding:0.65rem 0.8rem;
    font-size:0.85rem;
    font-family:var(--mono);
    white-space:pre-wrap;
    line-height:1.5;
  }
  .error-box{
    background:rgba(255,75,75,0.08);
    border:1px solid rgba(255,75,75,0.4);
    color:#ff8080;
    border-radius:var(--radius);
    padding:0.65rem 0.85rem;
    font-size:0.9rem;
  }

  /* ---------- INPUT BAR ---------- */
  #input-bar{
    flex-shrink:0;
    padding:1rem 3rem 1.5rem 3rem;
  }
  #input-form{
    max-width:850px;
    display:flex;
    align-items:center;
    background:var(--bg-input);
    border:1px solid var(--border-strong);
    border-radius:1.6rem;
    padding:0.4rem 0.4rem 0.4rem 1.1rem;
  }
  #input-form:focus-within{border-color:var(--primary);}
  #chat-input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:var(--font);
    font-size:1rem;
    padding:0.5rem 0;
  }
  #chat-input::placeholder{color:var(--text-faint);}
  #send-btn{
    width:2.1rem;height:2.1rem;
    border-radius:50%;
    border:none;
    background:var(--primary);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:1rem;
    transition:background .15s ease,opacity .15s ease;
  }
  #send-btn:hover{background:var(--primary-hover);}
  #send-btn:disabled{opacity:0.35;cursor:default;}

  /* scrollbars */
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:820px){
    #sidebar-toggle{display:flex;}
    #sidebar{
      position:fixed;
      top:0;left:0;bottom:0;
      z-index:40;
      margin-left:calc(-1 * var(--sidebar-w));
      box-shadow:2px 0 24px rgba(0,0,0,0.4);
    }
    #sidebar.open{margin-left:0;}
    #main-header{padding:1.25rem 1.25rem 0.75rem 3.5rem;}
    #main-header h1{font-size:1.5rem;}
    #chat-scroll{padding:0.5rem 1.25rem 1rem 1.25rem;}
    #input-bar{padding:0.75rem 1.25rem 1.25rem 1.25rem;}
  }
</style>
</head>
<body>

<button id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>

<div id="app">
  <aside id="sidebar">
    <h1>Agent OS</h1>
    <hr class="divider">
    <div class="alert alert-success"><span id="logfire-status">Logfire: Connected &amp; Tracing</span></div>
    <div class="alert alert-info"><span id="memory-id">Memory ID: --------</span></div>
    <button class="st-btn st-btn-primary" id="clear-btn">Clear History &amp; Memory</button>
  </aside>

  <main id="main">
    <div id="main-header"><h1>Enterprise Agentic Assistant</h1></div>
    <div id="chat-scroll"></div>
    <div id="input-bar">
      <form id="input-form">
        <input id="chat-input" type="text" placeholder="Ask about your documentation..." autocomplete="off" />
        <button id="send-btn" type="submit" aria-label="Send">➤</button>
      </form>
    </div>
  </main>
</div>

<script>
/* =========================================================
   CONFIG
   Point this at your real RAG backend. If it can't be reached
   (e.g. running this file standalone), a demo response is used
   instead so the UI remains fully explorable.
   ========================================================= */
const BACKEND_URL = window.location.origin;
const REQUEST_TIMEOUT_MS = 60000;

/* =========================================================
   STATE  (mirrors st.session_state)
   ========================================================= */
let sessionId = crypto.randomUUID();
let messages = []; // {role, content}

const chatScroll   = document.getElementById('chat-scroll');
const memoryIdEl   = document.getElementById('memory-id');
const inputForm    = document.getElementById('input-form');
const chatInput    = document.getElementById('chat-input');
const sendBtn      = document.getElementById('send-btn');
const clearBtn     = document.getElementById('clear-btn');
const sidebar      = document.getElementById('sidebar');
const sidebarToggle= document.getElementById('sidebar-toggle');

function updateMemoryId(){
  memoryIdEl.textContent = `Memory ID: ${sessionId.slice(0,8)}`;
}
updateMemoryId();

sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('open'));

/* =========================================================
   HISTORY RENDERING
   Like Streamlit's rerun model: only role+content persist.
   Live "thinking" widgets only exist for the in-flight turn.
   ========================================================= */
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderHistory(){
  chatScroll.innerHTML = '';
  messages.forEach(m => {
    const row = document.createElement('div');
    row.className = 'chat-msg';
    row.innerHTML = `
      <div class="avatar">${m.role === 'assistant' ? '🤖' : '👤'}</div>
      <div class="msg-body"><div class="msg-text">${escapeHtml(m.content)}</div></div>`;
    chatScroll.appendChild(row);
  });
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function clearHistory(){
  messages = [];
  sessionId = crypto.randomUUID();
  updateMemoryId();
  renderHistory();
}
clearBtn.addEventListener('click', clearHistory);

/* =========================================================
   DEMO / FALLBACK DATA
   Used only if the backend at BACKEND_URL can't be reached.
   ========================================================= */
function buildDemoResponse(prompt){
  return {
    thought_process: [
      "Parsed user intent and expanded query",
      "Retrieved top-k chunks from vector store (k=6)",
      "Re-ranked chunks with cross-encoder",
      "Synthesized answer with cited context"
    ],
    sources: [
      "Section 4.2 — Ingestion Pipeline: Documents are chunked into 512-token windows with 64-token overlap before embedding, ensuring semantic continuity across chunk boundaries and reducing context fragmentation for downstream retrieval.",
      "Section 6.1 — Retrieval Config: The retriever uses hybrid search (BM25 + dense vectors) merged via reciprocal rank fusion, which consistently outperformed pure dense retrieval on the internal eval set.",
      "Appendix C — Deployment Notes: The backend exposes a single /query endpoint accepting {q, thread_id}; thread_id scopes conversational memory per session and is cleared on demand from the sidebar."
    ],
    answer: `Based on the indexed documentation, here's what I found regarding "${prompt}":\n\nThis is a demo answer because ${BACKEND_URL} isn't reachable from this page. Point BACKEND_URL (top of the <script> tag) at your running RAG backend and this exact same UI will stream real answers, thought-process steps, and retrieved sources from it.`
  };
}

/* =========================================================
   CHAT SUBMIT
   ========================================================= */
inputForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const prompt = chatInput.value.trim();
  if(!prompt) return;

  chatInput.value = '';
  chatInput.disabled = true;
  sendBtn.disabled = true;

  // Collapse any previous turn's live widgets back to plain history (Streamlit rerun behavior)
  messages.push({role:'user', content: prompt});
  renderHistory();

  // --- build the live assistant row ---
  const row = document.createElement('div');
  row.className = 'chat-msg';
  row.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="msg-body">
      <div class="status-box" id="status-box">
        <div class="status-header" id="status-header">
          <div class="spinner" id="status-spinner"></div>
          <span id="status-label">Agent is thinking...</span>
          <span class="chev">▾</span>
        </div>
        <div class="status-body" id="status-body"></div>
      </div>
      <div class="msg-text" id="answer-text"></div>
    </div>`;
  chatScroll.appendChild(row);
  chatScroll.scrollTop = chatScroll.scrollHeight;

  const statusBox    = row.querySelector('#status-box');
  const statusHeader  = row.querySelector('#status-header');
  const statusLabel   = row.querySelector('#status-label');
  const statusSpinner = row.querySelector('#status-spinner');
  const statusBody    = row.querySelector('#status-body');
  const answerText     = row.querySelector('#answer-text');

  statusHeader.addEventListener('click', () => statusBox.classList.toggle('collapsed'));

  let data;
  try{
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
    const res = await fetch(`${BACKEND_URL}/query`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({q: prompt, thread_id: sessionId}),
      signal: controller.signal
    });
    clearTimeout(t);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  }catch(err){
    // fall back to demo data so the UI stays fully explorable offline
    await sleep(700);
    data = buildDemoResponse(prompt);
  }

  // --- show reasoning steps ---
  const steps = data.thought_process || [];
  for(let i=0;i<steps.length;i++){
    await sleep(140);
    const stepEl = document.createElement('div');
    stepEl.className = 'status-step';
    stepEl.textContent = `${steps[i]}`;
    statusBody.appendChild(stepEl);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  // --- sources expander (nested inside status body) ---
  const sources = data.sources || [];
  if(sources.length){
    const outer = document.createElement('div');
    outer.className = 'expander';
    outer.innerHTML = `<div class="expander-header"><span>View Retrieved Context (Sources)</span><span class="chev">▸</span></div><div class="expander-body"></div>`;
    outer.querySelector('.expander-header').addEventListener('click', () => outer.classList.toggle('open'));
    const outerBody = outer.querySelector('.expander-body');

    sources.forEach((source, i) => {
      const preview = source.slice(0,100).replace(/\n/g,' ') + '...';
      const inner = document.createElement('div');
      inner.className = 'expander';
      inner.innerHTML = `<div class="expander-header"><span>Chunk ${i+1}: ${escapeHtml(preview)}</span><span class="chev">▸</span></div><div class="expander-body"><div class="info-box">${escapeHtml(source)}</div></div>`;
      inner.querySelector('.expander-header').addEventListener('click', () => inner.classList.toggle('open'));
      outerBody.appendChild(inner);
    });

    statusBody.appendChild(outer);
  }

  // --- mark status complete & collapse ---
  statusSpinner.replaceWith(Object.assign(document.createElement('span'), {textContent:'✓', style:'line-height:1;'}));
  statusLabel.textContent = 'Answer Synthesized';
  statusBox.classList.add('collapsed');
  chatScroll.scrollTop = chatScroll.scrollHeight;

  // --- stream final answer char by char ---
  const fullAnswer = data.answer || 'No response.';
  let curr = '';
  for(const ch of fullAnswer){
    curr += ch;
    answerText.innerHTML = escapeHtml(curr) + '<span class="cursor">▌</span>';
    chatScroll.scrollTop = chatScroll.scrollHeight;
    await sleep(5);
  }
  answerText.textContent = fullAnswer;

  messages.push({role:'assistant', content: fullAnswer});

  chatInput.disabled = false;
  sendBtn.disabled = false;
  chatInput.focus();
});

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

renderHistory();
</script>
</body>
</html>
